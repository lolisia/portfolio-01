name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  PROJECT_PATH: Client
  SONAR_ORGANIZATION: lolisia
  SONAR_PROJECT_KEY: lolisia_portfolio-01
  TEST_ARTIFACTS_DIR: test-artifacts # Relative to the workspace; `github.workspace` is the host path inside a container job

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    # Forked PRs cannot read secrets, so skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Run inside the GameCI editor image so the Unity-generated .csproj reference paths resolve.
    # Keep the tag in sync with Client/ProjectSettings/ProjectVersion.txt.
    container:
      image: unityci/editor:ubuntu-6000.6.7f1-base-3
      options: --shm-size=4g # Each Unity process maps 1 GiB of shared memory; Docker defaults to 64 MiB
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube needs full history for blame / new-code detection

      # No Library cache here: with a restored Library the editor was repeatedly SIGKILLed
      # during startup, and this job only needs the .csproj files anyway.

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Same approach as game-ci/unity-builder: take the serial out of the .ulf
      # (base64 DeveloperData minus its 4-byte prefix) and activate with it.
      - name: Activate Unity license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          serial=$(printf '%s' "$UNITY_LICENSE" | sed -n 's/.*<DeveloperData Value="\([^"]*\)".*/\1/p' | base64 -d | tail -c +5)
          echo "::add-mask::$serial"
          mkdir -p /BlankProject/Assets
          unity-editor -batchmode -nographics -quit -logFile /dev/stdout \
            -serial "$serial" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
            -projectPath /BlankProject

      - name: Generate solution
        run: |
          unity-editor -batchmode -nographics -quit -logFile - \
            -projectPath "$PROJECT_PATH" \
            -executeMethod Packages.Rider.Editor.RiderScriptEditor.SyncSolution
          ls "$PROJECT_PATH"/*.sln "$PROJECT_PATH"/*.csproj

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Begin analysis and build
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.verbose=${{ runner.debug == '1' }} \
            /d:sonar.exclusions="**/InputSystem_Actions.cs" \
            /d:sonar.coverage.exclusions="**/Assets/Tests/**,**/Editor/**" \
            /d:sonar.cs.opencover.reportsPaths="$GITHUB_WORKSPACE/$TEST_ARTIFACTS_DIR/coverage/**/TestCoverageResults_*.xml"
          # Unity projects reference NUnit/TestRunner, so the scanner would treat them as test projects.
          dotnet build "$PROJECT_PATH/$PROJECT_PATH.sln" --configuration Debug -p:SonarQubeTestProject=false

      # PlayMode tests cover the MonoBehaviour lifecycle; the OpenCover report is picked up by `sonarscanner end`.
      - name: Run tests with coverage
        run: |
          unity-editor -batchmode -nographics -logFile - \
            -projectPath "$PROJECT_PATH" \
            -runTests -testPlatform PlayMode \
            -testResults "$GITHUB_WORKSPACE/$TEST_ARTIFACTS_DIR/test-results.xml" \
            -debugCodeOptimization -enableCodeCoverage \
            -coverageResultsPath "$GITHUB_WORKSPACE/$TEST_ARTIFACTS_DIR/coverage" \
            -coverageOptions "generateAdditionalMetrics;assemblyFilters:+aisilol;pathFilters:-**/InputSystem_Actions.cs"

      - name: End analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.TEST_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Return Unity license
        if: always()
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          unity-editor -batchmode -nographics -quit -logFile /dev/stdout -returnlicense \
            -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath /BlankProject
