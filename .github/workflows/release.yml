name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  PROJECT_PATH: Client
  BUILD_NAME: portfolio-01

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
    steps:
      # Unity editor image + Library easily exceed the runner's free disk space.
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No Library cache: with Unity 6000.6 a restored Library gets the editor SIGKILLed
      # (exit 137) during startup, while clean imports succeed.

      - uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ env.BUILD_NAME }}
          versioning: Semantic

      - name: Package build
        run: |
          cd build/${{ matrix.targetPlatform }}
          zip -qr "$GITHUB_WORKSPACE/${BUILD_NAME}-${GITHUB_REF_NAME}-${{ matrix.targetPlatform }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-${{ matrix.targetPlatform }}
          path: ${{ env.BUILD_NAME }}-*.zip
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
